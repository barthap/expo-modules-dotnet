name: checks

# Fast CI lane: no native toolchain, no Hermes, no Apple runners.
# Heavy native suite lives in native-tests.yml (separate workflow).
on: [push, pull_request]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile-app typecheck
      - run: pnpm --filter expo-modules-dotnet-autolinking test
      - run: pnpm --filter expo-modules-dotnet test

  generator-tests:
    name: generator-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test packages/expo-modules-dotnet/managed/packages/Expo.ModulesCore.Generator.Tests/Expo.ModulesCore.Generator.Tests.csproj

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Install cmake-format
        run: pipx install cmakelang
      - run: scripts/format.sh --check --all
