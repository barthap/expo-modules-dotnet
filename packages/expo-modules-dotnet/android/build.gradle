plugins {
  id 'com.android.library'
  id 'com.facebook.react'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dotnet'
version = '0.1.0'

android {
  namespace "expo.modules.dotnet"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared",
          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
          "-DADAPTER_ROOT=${project.projectDir}/.."
        cppFlags "-std=c++20"
      }
    }
  }
  buildFeatures {
    prefab true
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
  sourceSets {
    main {
      jniLibs.srcDirs = ["src/main/jniLibs"]
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  compileOnly 'com.facebook.fbjni:fbjni:0.5.1'
}
