plugins {
  id 'com.android.library'
  id 'com.facebook.react'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dotnet'
version = '0.1.0'

def appRoot = rootProject.projectDir.parentFile

tasks.register('expoDotnetLink', Exec) {
  workingDir appRoot

  def linkArgs = [
    'node',
    '--no-warnings',
    '--eval',
    "require('expo-modules-dotnet-autolinking').main(process.argv.slice(1))",
    'link',
    '--platform',
    'android',
    '--project-root',
    appRoot.absolutePath
  ]
  def loader = project.findProperty('expoDotnetLoader') ?: System.getenv('EXPO_DOTNET_LOADER')
  if (loader) {
    linkArgs += ['--mode', loader.toString()]
  }

  commandLine linkArgs
  outputs.upToDateWhen { false }
}

def expoDotnetLinkTask = tasks.named('expoDotnetLink')
def appProject = rootProject.findProject(':app')
if (appProject != null) {
  gradle.projectsEvaluated {
    appProject.tasks.matching { it.name == 'preBuild' }.configureEach {
      dependsOn expoDotnetLinkTask
    }
  }
} else {
  tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn expoDotnetLinkTask
  }
}

android {
  namespace "expo.modules.dotnet"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared",
          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
          "-DADAPTER_ROOT=${project.projectDir}/.."
        cppFlags "-std=c++20"
      }
    }
  }
  buildFeatures {
    prefab true
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  compileOnly 'com.facebook.fbjni:fbjni:0.5.1'
}
